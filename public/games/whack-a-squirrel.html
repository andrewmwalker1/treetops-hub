<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Squirrel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy-dark:#1b3b2f;
    --canopy:#254f3d;
    --bark:#4a2f23;
    --bark-dark:#3a2419;
    --amber:#e8a33d;
    --cream:#f4efe3;
    --plum:#6b4a73;
    --danger:#c1443b;
    --hole:#2a1810;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 0%, #2d5843 0%, var(--canopy-dark) 55%, #12251c 100%);
    font-family:'Nunito',sans-serif;
    color:var(--cream);
    padding:20px;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  h1{
    font-family:'Baloo 2',cursive;
    font-size:2.1rem;
    text-align:center;
    margin:0 0 4px;
    color:var(--amber);
    text-shadow:0 3px 0 var(--bark-dark);
    letter-spacing:0.5px;
  }
  .tagline{
    text-align:center;
    font-size:0.85rem;
    opacity:0.75;
    margin:0 0 16px;
    font-weight:600;
  }
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.25);
    border-radius:14px;
    padding:10px 16px;
    margin-bottom:14px;
    font-family:'Baloo 2',cursive;
    border:2px solid rgba(232,163,61,0.35);
  }
  .hud div{text-align:center;}
  .hud .label{
    display:block;
    font-family:'Nunito',sans-serif;
    font-size:0.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:0.65;
    margin-bottom:1px;
  }
  .hud .value{font-size:1.35rem;}
  #combo-val{color:var(--amber);}
  #lives-val{color:var(--danger);}
  #best-val{color:#9fd8b8;}

  .tree{
    position:relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(180deg, var(--bark) 0%, var(--bark-dark) 100%);
    border-radius:28px;
    padding:26px 18px 22px;
    box-shadow:0 12px 0 rgba(0,0,0,0.35), inset 0 0 40px rgba(0,0,0,0.3);
    border:3px solid #2e1c12;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .hole-wrap{
    aspect-ratio:1;
    position:relative;
  }
  .hole{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #3a2418, var(--hole) 70%);
    box-shadow:inset 0 6px 10px rgba(0,0,0,0.6), inset 0 -3px 4px rgba(255,255,255,0.05);
    overflow:hidden;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .hole:active{transform:scale(0.97);}
  .critter{
    width:4.2rem;
    height:4.2rem;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-size:3.6rem;
    line-height:1;
    transform:translateY(100%);
    transition:transform 0.12s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 4px 4px rgba(0,0,0,0.5));
    user-select:none;
    -webkit-user-select:none;
  }
  .critter svg, .critter img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    pointer-events:none;
  }
  .hole.up .critter{transform:translateY(6%);}
  .hole.golden .critter{
    animation:glow 0.5s ease-in-out infinite alternate;
  }
  @keyframes glow{
    from{filter:drop-shadow(0 0 4px var(--amber)) drop-shadow(0 4px 4px rgba(0,0,0,0.5));}
    to{filter:drop-shadow(0 0 14px var(--amber)) drop-shadow(0 4px 4px rgba(0,0,0,0.5));}
  }
  .popup{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:1rem;
    pointer-events:none;
    animation:float-up 0.7s ease-out forwards;
    z-index:5;
    white-space:nowrap;
  }
  @keyframes float-up{
    0%{opacity:1; transform:translate(-50%,0);}
    100%{opacity:0; transform:translate(-50%,-32px);}
  }
  .controls{
    text-align:center;
    margin-top:18px;
  }
  button.main-btn{
    font-family:'Baloo 2',cursive;
    font-size:1.05rem;
    font-weight:700;
    background:linear-gradient(180deg, var(--amber), #c9822a);
    color:#2a1810;
    border:none;
    padding:12px 32px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 4px 0 #a56a1f;
  }
  button.main-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #a56a1f;
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,20,15,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
  }
  .overlay.hidden{display:none;}
  .card{
    background:var(--canopy);
    border:3px solid var(--amber);
    border-radius:22px;
    padding:32px 28px;
    text-align:center;
    max-width:340px;
  }
  .card h2{
    font-family:'Baloo 2',cursive;
    color:var(--amber);
    margin-top:0;
  }
  .card p{font-size:0.9rem; opacity:0.85; line-height:1.5;}
  .legend{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:14px;
    font-size:0.78rem;
    opacity:0.8;
    flex-wrap:wrap;
  }
  .legend span{display:flex; align-items:center; gap:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌳 Whack-a-Squirrel</h1>
  <p class="tagline">Tap the squirrels. Dodge the wasps. Don't miss.</p>

  <div class="hud">
    <div><span class="label">Score</span><span class="value" id="score-val">0</span></div>
    <div><span class="label">Combo</span><span class="value" id="combo-val">x1</span></div>
    <div><span class="label">Lives</span><span class="value" id="lives-val">❤️❤️❤️</span></div>
    <div><span class="label">Best</span><span class="value" id="best-val">0</span></div>
  </div>

  <div class="tree">
    <div class="grid" id="grid"></div>
  </div>

  <div class="controls">
    <button class="main-btn" id="start-btn">Start Game</button>
  </div>

  <div class="legend">
    <span>🐿️ +10</span>
    <span>✨ Golden +50</span>
    <span>🐝 avoid!</span>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-msg">Final score: 0</p>
    <button class="main-btn" id="overlay-btn">Play Again</button>
  </div>
</div>

const grid = document.getElementById('grid');
const scoreEl = document.getElementById('score-val');
const comboEl = document.getElementById('combo-val');
const livesEl = document.getElementById('lives-val');
const bestEl = document.getElementById('best-val');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const startBtn = document.getElementById('start-btn');
const overlayBtn = document.getElementById('overlay-btn');

let holes = [];
let state = null;
let spawnTimer = null;
let bestScore = 0;

// Build holes
for (let i = 0; i < HOLE_COUNT; i++) {
  const wrap = document.createElement('div');
  wrap.className = 'hole-wrap';
  const hole = document.createElement('div');
  hole.className = 'hole';
  hole.dataset.index = i;
  const critter = document.createElement('div');
  critter.className = 'critter';
  hole.appendChild(critter);
  wrap.appendChild(hole);
  grid.appendChild(wrap);
  holes.push({ el: hole, critterEl: critter, occupant: null, hideTimeout: null });
  hole.addEventListener('click', () => handleClick(i));
}

async function loadBest() {
  const stored = localStorage.getItem('whack-squirrel-highscore');
  bestScore = stored ? parseInt(stored, 10) || 0 : 0;
  bestEl.textContent = bestScore;
}

async function saveBest() {
  localStorage.setItem('whack-squirrel-highscore', String(bestScore));
}

function newState() {
  return {
    score: 0,
    lives: 3,
    combo: 0,
    multiplier: 1,
    playing: true,
    elapsed: 0
  };
}

function currentSpeeds() {
  // difficulty ramps with score, floors applied
  const t = Math.min(state.score, 600) / 600; // 0..1
  const showTime = 1300 - t * 750;   // 1300ms -> 550ms
  const gapTime = 700 - t * 400;     // 700ms -> 300ms
  return {
    showTime: Math.max(showTime, 550),
    gapTime: Math.max(gapTime, 300)
  };
}

function pickEmptyHole() {
  const empty = holes.map((h, i) => h.occupant ? null : i).filter(v => v !== null);
  if (empty.length === 0) return null;
  return empty[Math.floor(Math.random() * empty.length)];
}

function spawnCritter() {
  if (!state || !state.playing) return;
  const idx = pickEmptyHole();
  const { showTime } = currentSpeeds();

  if (idx !== null) {
    const roll = Math.random();
    let type;
    if (roll < 0.18) type = 'golden';
    else if (roll < 0.40) type = 'decoy';
    else type = 'squirrel';

    const h = holes[idx];
    h.occupant = type;
    if (type === 'decoy') {
      h.critterEl.textContent = '🐝';
    } else if (type === 'golden') {
      h.critterEl.innerHTML = `<img src="${GOLDEN_SQUIRREL_IMG}" alt="golden squirrel" draggable="false">`;
    } else {
      h.critterEl.innerHTML = `<img src="${SQUIRREL_IMG}" alt="squirrel" draggable="false">`;
    }
    h.el.classList.add('up');
    if (type === 'golden') h.el.classList.add('golden');

    const duration = type === 'golden' ? showTime * 0.7 : showTime;
    h.hideTimeout = setTimeout(() => {
      const wasSquirrel = h.occupant === 'squirrel' || h.occupant === 'golden';
      clearHole(idx);
      if (wasSquirrel && state.playing) {
        loseLife();
      }
    }, duration);
  }

  const { gapTime } = currentSpeeds();
  spawnTimer = setTimeout(spawnCritter, gapTime + Math.random() * 200);
}

function clearHole(idx) {
  const h = holes[idx];
  h.el.classList.remove('up', 'golden');
  clearTimeout(h.hideTimeout);
  h.occupant = null;
}

function showPopup(holeEl, text, color) {
  const p = document.createElement('div');
  p.className = 'popup';
  p.textContent = text;
  p.style.color = color;
  holeEl.appendChild(p);
  setTimeout(() => p.remove(), 700);
}

function handleClick(idx) {
  if (!state || !state.playing) return;
  const h = holes[idx];

  if (h.occupant === 'squirrel') {
    const pts = 10 * state.multiplier;
    state.score += pts;
    registerHit(pts, h.el, '#f4efe3');
    clearHole(idx);
  } else if (h.occupant === 'golden') {
    const pts = 50 * state.multiplier;
    state.score += pts;
    registerHit(pts, h.el, '#e8a33d');
    clearHole(idx);
  } else if (h.occupant === 'decoy') {
    showPopup(h.el, 'Ouch!', '#ff8a80');
    clearHole(idx);
    loseLife();
  } else {
    // empty hole click
    showPopup(h.el, 'Miss', '#ff8a80');
    loseLife();
  }
  render();
}

function registerHit(pts, holeEl, color) {
  state.combo++;
  state.multiplier = 1 + Math.floor(state.combo / 5);
  showPopup(holeEl, '+' + pts, color);
}

function loseLife() {
  state.combo = 0;
  state.multiplier = 1;
  state.lives--;
  if (state.lives <= 0) {
    endGame();
  }
  render();
}

function render() {
  if (!state) return;
  scoreEl.textContent = state.score;
  comboEl.textContent = 'x' + state.multiplier;
  livesEl.textContent = '❤️'.repeat(Math.max(state.lives, 0)) || '💀';
}

function startGame() {
  overlay.classList.add('hidden');
  startBtn.style.display = 'none';
  state = newState();
  holes.forEach((h, i) => clearHole(i));
  render();
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawnCritter, 400);
}

async function endGame() {
  state.playing = false;
  clearTimeout(spawnTimer);
  holes.forEach((h, i) => clearHole(i));
  const isNewBest = state.score > bestScore;
  if (isNewBest) {
    bestScore = state.score;
    bestEl.textContent = bestScore;
    await saveBest();
  }
  overlayTitle.textContent = isNewBest ? '🏆 New Best!' : 'Game Over';
  overlayMsg.textContent = `Final score: ${state.score}` + (isNewBest ? ' — that\'s your new record!' : '');
  overlay.classList.remove('hidden');
  startBtn.style.display = 'inline-block';
}

startBtn.addEventListener('click', startGame);
overlayBtn.addEventListener('click', startGame);

loadBest();
